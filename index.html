<style>
:root {
  --bg:#0b0f19;
  --card:#151b2b;
  --paper:#1e2538;
  --gold:#d4af37;
  --gold-light:#f6e7ad;
  --wine:#722f37;
  --text:#e0e6ed;
  --muted:#94a3b8;
  --line:rgba(212,175,55,.25);
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Georgia, serif;
  font-size:17px;
  line-height:1.7;
}

html[lang="ar"] body {
  font-family:"Amiri", serif;
}

html[lang="ar"] h1,
html[lang="ar"] h2,
html[lang="ar"] h3,
html[lang="ar"] button,
html[lang="ar"] label {
  font-family:"Reem Kufi", sans-serif;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  border:0;
  cursor:pointer;
  font-family:inherit;
}

img {
  max-width:100%;
  display:block;
}

.wrap {
  width:100%;
  max-width:1150px;
  margin:auto;
  padding:0 20px;
}

/* رأس الموقع */
.site-head {
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,15,25,.97);
  border-bottom:1px solid var(--line);
}

.site-head .wrap {
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
}

.logo {
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border:2px solid var(--gold);
  color:var(--gold-light);
  font-family:Georgia, serif;
  font-size:20px;
  transform:rotate(45deg);
}

.logo span {
  transform:rotate(-45deg);
}

.brand-text {
  margin-right:12px;
}

html[dir="ltr"] .brand-text {
  margin-right:0;
  margin-left:12px;
}

.brand-text strong {
  display:block;
  color:var(--text);
  font-size:19px;
}

.brand-text small {
  display:block;
  color:var(--muted);
  font-size:11px;
}

.nav-actions {
  display:flex;
  align-items:center;
  gap:8px;
}

.lang-btn,
.menu-btn {
  padding:9px 13px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--gold);
  font-size:14px;
}

.menu-btn {
  display:none;
  font-size:22px;
}

/* القائمة */
.nav-links {
  display:flex;
  align-items:center;
}

.nav-links a {
  margin-right:25px;
  color:var(--muted);
  transition:.3s;
}

html[dir="ltr"] .nav-links a {
  margin-right:0;
  margin-left:25px;
}

.nav-links a:hover,
.nav-links a.active {
  color:var(--gold);
}

/* الشريط */
.quotes-strip {
  overflow:hidden;
  padding:9px 0;
  background:var(--wine);
  direction:ltr;
}

.quotes-track {
  display:flex;
  width:max-content;
  animation:moveQuotes 45s linear infinite;
}

.quotes-track span {
  white-space:nowrap;
  padding:0 28px;
  color:white;
}

@keyframes moveQuotes {
  from { transform:translateX(0); }
  to { transform:translateX(-50%); }
}

html[dir="rtl"] .quotes-track {
  animation-direction:reverse;
}

/* الواجهة */
.hero {
  padding:55px 0;
  text-align:center;
}

.hero-box {
  position:relative;
  min-height:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  padding:35px 20px;
  background:#17152b;
}

.hero-image {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  opacity:0;
  transition:opacity 1s ease;
}

.hero-image.active {
  opacity:1;
}

.hero-box::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    rgba(5,8,20,.65),
    rgba(5,8,20,.9)
  );
}

.hero-content {
  position:relative;
  z-index:1;
}

.hero h1 {
  margin:15px 0;
  color:var(--gold-light);
  font-size:clamp(35px,8vw,75px);
  text-shadow:0 3px 15px #000;
}

.hero p {
  max-width:650px;
  color:white;
  font-size:20px;
  text-shadow:0 2px 10px #000;
}

/* الأقسام */
.section {
  padding:55px 0;
}

.section-title {
  margin-bottom:30px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
  color:var(--gold);
  font-size:clamp(27px,5vw,42px);
}

/* نموذج التعليقات */
.ideas-layout {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
}

.ideas-form {
  padding:24px;
  border:1px solid var(--line);
  background:var(--paper);
}

.form-group {
  margin-bottom:18px;
}

.form-group label {
  display:block;
  margin-bottom:7px;
  color:var(--gold);
}

.form-input,
.form-textarea {
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  outline:0;
  background:var(--bg);
  color:var(--text);
  font:inherit;
  font-size:16px;
}

.form-textarea {
  min-height:120px;
  resize:vertical;
}

.form-input:focus,
.form-textarea:focus {
  border-color:var(--gold);
}

.btn-primary {
  width:100%;
  padding:14px;
  background:var(--gold);
  color:var(--bg);
  font-size:16px;
  font-weight:bold;
}

.btn-primary:disabled {
  opacity:.6;
  cursor:wait;
}

.ideas-wall {
  max-height:550px;
  overflow:auto;
}

.idea-note {
  margin-bottom:15px;
  padding:17px;
  border-right:3px solid var(--wine);
  background:var(--card);
  color:var(--muted);
}

html[dir="ltr"] .idea-note {
  border-right:0;
  border-left:3px solid var(--wine);
}

.idea-note .author {
  display:block;
  margin-top:8px;
  color:var(--gold);
  font-size:13px;
}

.loading,
.empty-state,
.error-state {
  padding:40px 20px;
  border:1px dashed var(--line);
  color:var(--muted);
  text-align:center;
}

.empty-state .icon,
.error-state .icon {
  display:block;
  margin-bottom:10px;
  font-size:40px;
}

/* بطاقات الروايات */
.novels-carousel {
  display:flex;
  gap:20px;
  overflow-x:auto;
  padding:10px 0 25px;
}

.novel-card-link {
  flex:0 0 auto;
  width:230px;
}

.novel-card {
  position:relative;
  min-height:340px;
  aspect-ratio:2/3;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--card);
  cursor:pointer;
  transition:.3s;
}

.novel-card:hover {
  transform:translateY(-6px);
  box-shadow:0 15px 35px #000;
}

.novel-card img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.novel-card::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 25%,
    rgba(0,0,0,.9)
  );
}

.novel-card-content {
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  z-index:1;
  padding:25px;
  text-align:center;
}

.novel-card-content h3 {
  color:var(--gold-light);
  font-size:34px;
  direction:ltr;
}

.novel-card-content p {
  color:white;
}

/* صفحة تفاصيل الرواية */
.novel-details {
  max-width:950px;
  margin:auto;
}

.novel-details-box {
  display:grid;
  grid-template-columns:300px 1fr;
  gap:30px;
  padding:25px;
  border:1px solid var(--line);
  background:var(--card);
}

.novel-cover {
  width:100%;
  aspect-ratio:2/3;
  height:auto;
  object-fit:cover;
  border-radius:10px;
}

.novel-details h1 {
  margin:12px 0 16px;
  color:var(--gold-light);
  font-size:clamp(30px,6vw,52px);
  direction:ltr;
}

.novel-description {
  margin-bottom:20px;
  color:var(--muted);
  font-size:18px;
}

.chapter-count {
  display:inline-block;
  margin-bottom:20px;
  padding:9px 14px;
  border:1px solid var(--line);
  color:var(--gold);
}

.chapter-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.chapter-button {
  display:inline-block;
  padding:11px 16px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--bg);
}

.chapter-button.secondary {
  background:transparent;
  color:var(--gold);
}

.chapter-button.disabled {
  opacity:.4;
  pointer-events:none;
}

.chapter-list {
  display:grid;
  gap:12px;
}

.chapter-item {
  display:block;
  padding:16px;
  border:1px solid var(--line);
  background:var(--card);
  transition:.3s;
}

.chapter-item:hover {
  border-color:var(--gold);
  color:var(--gold);
}

.reader-back {
  display:inline-block;
  margin-bottom:20px;
  padding:8px 14px;
  border:1px solid var(--line);
  color:var(--gold);
}

.chapter-content {
  max-width:850px;
  margin:auto;
  padding:30px;
  background:var(--paper);
  color:var(--text);
  font-size:19px;
  line-height:2;
}

.chapter-content h2 {
  margin-bottom:25px;
  text-align:center;
}

.chapter-nav {
  display:flex;
  justify-content:center;
  margin-top:35px;
}

.chapter-nav .chapter-button {
  padding:14px 28px;
  font-size:17px;
}

/* عن الموقع */
.about-box {
  max-width:800px;
  margin:auto;
  text-align:center;
}

.about-box p {
  margin-bottom:18px;
  color:var(--muted);
}

/* Footer */
footer {
  margin-top:50px;
  padding:45px 0 25px;
  border-top:3px solid var(--gold);
  background:#05080f;
}

.footer-grid {
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:30px;
}

.footer-col h4 {
  margin-bottom:14px;
  color:var(--gold);
}

.footer-col ul {
  list-style:none;
}

.footer-col li {
  margin-bottom:8px;
}

.footer-col a {
  color:var(--muted);
}

.copyright {
  margin-top:35px;
  padding-top:20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  text-align:center;
  font-size:12px;
}

.toast {
  position:fixed;
  bottom:25px;
  left:50%;
  z-index:100;
  padding:12px 22px;
  transform:translate(-50%,120px);
  background:var(--gold);
  color:var(--bg);
  transition:.4s;
}

.toast.show {
  transform:translate(-50%,0);
}

@media(max-width:850px) {
  .menu-btn {
    display:block;
  }

  .nav-links {
    position:absolute;
    top:70px;
    right:0;
    left:0;
    display:none;
    flex-direction:column;
    padding:10px 20px;
    background:var(--bg);
    border-bottom:2px solid var(--gold);
  }

  body.menu-open .nav-links {
    display:flex;
  }

  .nav-links a,
  html[dir="ltr"] .nav-links a {
    width:100%;
    margin:0;
    padding:13px;
    border-bottom:1px solid var(--line);
    text-align:center;
  }

  .ideas-layout {
    grid-template-columns:1fr;
  }

  .novel-details-box {
    grid-template-columns:1fr;
  }

  .novel-cover {
    width:min(100%,280px);
    aspect-ratio:2/3;
    margin:auto;
  }

  .novel-details-info {
    text-align:center;
  }

  .chapter-buttons {
    justify-content:center;
  }

  .footer-grid {
    grid-template-columns:1fr;
    text-align:center;
  }
}
</style>
</head>

      "شاب يجد كتابًا غامضًا في قبو منزل جدته الراحلة، فيسحبه إلى أجساد وعوالم سبعة أعراق مختلفة، كل عالم يحمل درسًا لن ينساه.",

    descriptionEn:
      "A young man finds a mysterious book in his late grandmother's basement, and it pulls him into the bodies and worlds of seven different races, each one carrying a lesson he'll never forget.",

    chapters: [
      {
        id: "ch1",
        titleAr: "الفصل الأول: الكتاب في القبو",
        titleEn: "Chapter One: The Book in the Basement",
        contentAr: [
          "كان نايلو يعرف أن هناك فراغًا في داخله، لكنه لم يعرف أبدًا شكله بالضبط.",
          "لم يكن فراغًا يُرى، ولا وجعًا يُشار إليه بإصبع. كان أشبه بغرفة في بيت قديم، أغلقها أحدهم منذ زمن بعيد ونسي أن يخبره بمفتاحها. كان في الخامسة والعشرين، يعمل في متجر كتب مستعملة صغير في زاوية شارع هادئ، يبيع نسخًا قديمة لأناس لا يزورون المتجر إلا مرة كل بضعة أسابيع. حياة هادئة. حياة مرتّبة. حياة ينقصها شيء لا اسم له.",
          "كل ليلة تقريبًا، كان الحلم نفسه يعود. أضواء بعيدة تتحرك خلف ضباب كثيف. أصوات تهمس بلغات لا يفهمها لكنه يعرف، في مكان ما خلف أذنيه، أنه سمعها من قبل. وصوت. صوت امرأة عجوز، دافئ كالخبز الطازج، يقول له كلمات لا يستطيع أبدًا أن يتذكرها بعد أن يستيقظ.",
          "جدته.",
          "كانت هي من ربّته بعد أن غابا والداه في حادثة لم يتحدث عنها أحد، وكانت هي من جلست بجانب سريره كل ليلة، لسنوات، تحكي له قصصًا. كان يتذكر صوتها. يتذكر دفء يدها على رأسه. لكنه لا يتذكر كلمة واحدة مما قالته.",
          "في مساء خريفي، بعد سنة كاملة من رحيلها، وقف نايلو أمام باب المنزل القديم الذي تربّى فيه، والذي ظل مغلقًا منذ جنازتها. مدّ يده إلى المفتاح المعلّق حول رقبته منذ ذلك اليوم، وفتح الباب.",
          "الغبار استقبله كصديق قديم. تسلّل عبر الردهة، صعد الدرج المتآكل، مرّ بغرفتها الفارغة، حتى وصل إلى باب القبو. توقف أمامه طويلًا.",
          "همس لنفسه: \"ربما هناك شيء نسيته.\"",
          "لم يعرف ماذا يبحث عنه بالضبط. لكن قدميه قادتاه إلى الأسفل، درجة درجة، حتى وصل إلى أرضية القبو الباردة. أشعل مصباحه اليدوي، ومسح الضوء على الصناديق المكدسة، والرفوف المائلة، وخيوط العنكبوت المعلّقة كستائر رمادية.",
          "وفي الزاوية الأبعد، تحت قماش أبيض اصفرّ من القدم، وجده.",
          "كتاب.",
          "سحب القماش عنه بيد مرتجفة. غلافه من جلد غامق، بارد تحت أصابعه رغم دفء الغرفة. نقش صغير على واجهته: عين مفتوحة، وفي وسطها نجمة صغيرة. لا عنوان مؤلف. لا تاريخ نشر. فقط، بخط ذهبي باهت يكاد يختفي: \"كتاب الأعراق السبعة\".",
          "شعر نايلو بشيء يتحرك في صدره، شيء نائم منذ سنوات بدأ يفتح عينيه ببطء.",
          "جلس على الأرض الباردة، ووضع الكتاب على ركبتيه، وفتحه.",
          "الصفحات كانت فارغة. بيضاء تمامًا. لكن بينما كان يحدّق فيها، بدأ الغبار في الهواء حوله يتحرك، ليس مع تيار الهواء، بل نحوه، نحو الكتاب، كأن الغرفة كلها تنحني تجاهه. وسمع، من مكان بعيد جدًا وقريب جدًا في آن، صوت جدته يهمس كلمة نسيها منذ سنوات: \"اقرأ.\"",
          "وقبل أن يستطيع نايلو أن يسأل نفسه إن كان هذا حقيقيًا، سحبه الضوء إلى الداخل.",
          "استيقظ على أرض صخرية باردة، تحت سماء لا شمس فيها ولا قمر، فقط وميض رمادي خافت يملأ الأفق من كل جهة، كأن العالم كله معلّق بين لحظتي غروب لا تنتهيان. حاول أن ينهض، فوجد يديه مختلفتين. أطول. أنحف. بشرته تحوّلت إلى رمادي شاحب، وأظافره صارت حادة كمخالب صغيرة. لمس وجهه، فوجد أذنين طويلتين مدببتين، وأنيابًا خفيفة عند زاوية فمه.",
          "لم يعد نايلو.",
          "نظر إلى الماء الراكد في حفرة صخرية قريبة، فرأى انعكاسًا لكائن غريب، لكن عينيه — عيناه هو — بقيتا كما هما، فضوليتين، حائرتين. وسمع صوتًا في رأسه، ليس صوته، لكنه يعرف أنه اسمه الآن: رمادي.",
          "قبل أن يستوعب أي شيء آخر، وجد نفسه محاطًا بمجموعة من كائنات تشبهه، يرتدون عباءات من جلد داكن، يحملون مشاعل لا تصدر نارًا حقيقية بل وهجًا باهتًا يكفي بالكاد للرؤية. كانوا يقفون عند فوهة كهف واسع، ينظرون جميعًا إلى نقطة واحدة في السماء البعيدة.",
          "شق من نور.",
          "خيط رفيع من ضوء أبيض ساطع، يشق الغسق الرمادي الأبدي كجرح في قماش قديم. لم يكن قد رآه أحد من قبل. بدا غريبًا، مخيفًا، غير منتمٍ لهذا العالم بالكامل.",
          "قال أحد الكبار في المجموعة، صوته أجش من سنوات الصمت الطويل: \"هذا هو الشق. لم يعد أحد ممن ذهبوا لاستكشافه.\"",
          "سأل رمادي، وصوته الجديد يخرج غريبًا من حلقه: \"ولماذا نذهب نحن الآن؟\"",
          "أجابه الكبير: \"لأن شيخ القبيلة أمر. ولأننا الوحيدون الذين تبقّوا ممن لم يُرسَلوا بعد.\"",
          "مشت المجموعة عبر الوادي الصخري، تتسلق بين الكهوف والأشجار ذات الجذوع البيضاء والأوراق السوداء، حتى وصلت إلى سفح تلة عالية، حيث كان الشق أقرب، أوضح، أكبر. توقف الجميع، يتراجعون خطوة كاملة، كأن النور نفسه يحرق أعينهم من مسافة.",
          "همس أحدهم: \"لا تقتربوا أكثر. الضوء الحقيقي يقتل.\"",
          "لكن رمادي، بدافع لا يفهمه هو نفسه، خطا خطوة إلى الأمام.",
          "صرخ أحدهم خلفه: \"ماذا تفعل؟\"",
          "لم يجب. شيء في داخله، شيء يعرف أنه ليس من هذا العالم أصلًا، كان يسحبه نحو الضوء بدل أن يدفعه بعيدًا عنه. اقترب أكثر، وأكثر، حتى وقف تحت الشق مباشرة، والنور يسقط على وجهه.",
          "لم يحترق.",
          "لم يتألم.",
          "بدلًا من ذلك، شعر بدفء لم يشعر به من قبل، دفء يشبه يد جدته على رأسه في ذكرى باهتة. رفع عينيه، ونظر إلى مصدر الضوء عن قرب لأول مرة، فرأى ما لم يره أحد من الغول من قبل: لم يكن الشق بابًا لخطر قادم، بل كان بذرة. بذرة نجم صغيرة، ساقطة من سماء بعيدة، توهجت في هذا العالم المظلم بلا قصد أذى، فقط لأنها لا تعرف كيف تكون غير ذلك.",
          "نادى رمادي على رفاقه: \"تعالوا. انظروا.\"",
          "تردد الجميع طويلًا، لكن أحدهم، أصغرهم سنًا، اقترب أولًا، خطوة بخطوة، جسده يرتجف من الخوف المتوارث لا من الألم الفعلي. وعندما وقف تحت النور ولم يحترق، بكى.",
          "قال وهو يمسح دموعه بيد مرتجفة: \"لم أكن أعرف أن الضوء يمكن أن يكون بهذا الشكل.\"",
          "عاد رمادي مع رفاقه إلى القبيلة، ليس بخبر عن خطر يجب إطفاؤه، بل بخبر عن ضيف يجب تعلّم العيش بجانبه. جلس شيخ القبيلة يستمع، عيناه الرماديتان تتحرك بين الشك والفضول.",
          "سأله الشيخ أخيرًا: \"وإن كان هذا فخًا؟ وإن كان هذا اللين بداية أذى أكبر؟\"",
          "أجابه رمادي: \"وإن كان كذلك، ألسنا نخاف كل شيء لا نعرفه أصلًا؟ نحن نعيش في الغسق منذ أجيال، ولم نجرب أبدًا أن نقترب من نور حقيقي لنعرف. ربما حان الوقت أن نتعلم، بدل أن نهرب.\"",
          "طال الصمت في الكهف الكبير. ثم أومأ الشيخ برأسه ببطء، إيماءة صغيرة، لكنها كافية.",
          "في الأيام التالية، بدأت القبيلة، بحذر شديد وخطوات متردّدة، تقترب من الشق أكثر فأكثر. لم يعد نورًا يُخشى، بل صار جزءًا من مشهد أرض الغسق، بذرة نجم صغيرة تنير زاوية واحدة من عالم لم ير الضوء الحقيقي منذ ولادته.",
          "وفي ليلة هادئة، بينما كان رمادي يجلس عند فوهة كهفه، يراقب الشق البعيد يتوهج بلطف، شعر بجسده يبدأ يخف، كأن خيطًا غير مرئي بدأ يسحبه للخلف، نحو مكان آخر.",
          "نظر إلى يديه، فرآهما تتلاشيان ببطء، تعودان إلى شكلهما الأول.",
          "همس، وهو يعرف أن أحدًا هنا لن يسمعه بعد لحظات: \"شكرًا لك.\"",
          "ثم أظلم كل شيء.",
          "فتح نايلو عينيه، فوجد نفسه على أرضية القبو الباردة كما كان، والكتاب مفتوحًا على ركبتيه، وصفحته الأولى لم تعد بيضاء بالكامل. في أسفلها، بحبر يتلألأ بلون رمادي فضي خافت، ظهرت كلمة واحدة: \"رمادي\".",
          "اسم لن ينساه أبدًا.",
          "رفع نايلو عينيه عن الصفحة، وقلبه يخفق بعنف، ونظر نحو الظلام العميق في زاوية القبو البعيدة، حيث كانت الصفحة التالية من الكتاب تنتظره، بيضاء، صامتة، جائعة لقصة أخرى."

        contentEn: [
          "Nailo always knew there was an emptiness inside him, but he never quite knew its shape.",
          "It wasn't an emptiness you could see, or a pain you could point to. It was more like a room in an old house, one that someone had locked away long ago and forgotten to leave him the key. He was twenty-five, working in a small secondhand bookshop on the corner of a quiet street, selling old copies to people who rarely visited more than once every few weeks. A quiet life. An orderly life. A life missing something with no name.",
          "Almost every night, the same dream returned. Distant lights moving behind thick fog. Voices whispering in languages he didn't understand, yet somehow, somewhere behind his ears, he knew he had heard them before. And a voice. The voice of an old woman, warm as fresh bread, saying words he could never remember once he woke.",
          "His grandmother.",
          "She was the one who raised him after his parents vanished in an accident no one ever spoke of, and she was the one who sat beside his bed every night for years, telling him stories. He remembered her voice. He remembered the warmth of her hand on his head. But he couldn't remember a single word she had said.",
          "One autumn evening, a full year after her passing, Nailo stood before the door of the old house where he had grown up, which had stayed shut since her funeral. He reached for the key hanging around his neck since that day, and opened the door.",
          "The dust welcomed him like an old friend. It crept through the hallway, climbed the worn staircase, passed by her empty room, until he reached the basement door. He stood before it for a long time.",
          "He whispered to himself: \"Maybe there's something I forgot.\"",
          "He didn't know exactly what he was looking for. But his feet carried him down, step by step, until he reached the cold basement floor. He switched on his flashlight and swept its beam across stacked boxes, tilted shelves, and cobwebs hanging like grey curtains.",
          "And in the farthest corner, beneath a white cloth yellowed with age, he found it.",
          "A book.",
          "He pulled the cloth away with a trembling hand. Its cover was dark leather, cold beneath his fingers despite the warmth of the room. A small emblem was etched into its face: an open eye, with a tiny star at its center. No author's name. No publication date. Just, in faded gold letters barely visible: \"The Book of the Seven Races.\"",
          "Nailo felt something stir in his chest, something that had slept for years, slowly opening its eyes.",
          "He sat on the cold floor, set the book on his knees, and opened it.",
          "The pages were blank. Completely white. But as he stared at them, the dust in the air around him began to move, not with the draft, but toward him, toward the book, as though the whole room were leaning in its direction. And he heard, from somewhere both very far and very near at once, his grandmother's voice whispering a word he had forgotten for years: \"Read.\"",
          "And before Nailo could ask himself whether this was real, the light pulled him inside.",
          "He woke on cold rocky ground, beneath a sky with no sun and no moon, only a faint grey glow filling the horizon in every direction, as though the whole world hung suspended between two endless sunsets. He tried to stand, and found his hands were different. Longer. Thinner. His skin had turned pale grey, and his nails had become sharp like small claws. He touched his face and found long pointed ears, and faint fangs at the corner of his mouth.",
          "He was no longer Nailo.",
          "He looked into a still pool in a nearby rocky hollow, and saw the reflection of a strange creature, but his eyes — his own eyes — stayed exactly as they were, curious, confused. And he heard a voice in his head, not his own, yet he knew it was his name now: Grey.",
          "Before he could take in anything else, he found himself surrounded by a group of creatures like himself, wearing cloaks of dark hide, carrying torches that gave off no real fire, only a faint glow, barely enough to see by. They stood at the mouth of a wide cave, all staring at a single point in the distant sky.",
          "A crack of light.",
          "A thin thread of blinding white light, splitting the eternal grey dusk like a wound in old cloth. No one had ever seen it before. It looked strange, frightening, entirely foreign to this world.",
          "One of the elders in the group said, his voice hoarse from years of long silence: \"That is the Crack. No one who went to explore it has ever come back.\"",
          "Grey asked, his new voice sounding strange in his own throat: \"Then why are we going now?\"",
          "The elder answered: \"Because the tribe's chief ordered it. And because we are the only ones left who haven't been sent yet.\"",
          "The group walked across the rocky valley, climbing between caves and trees with white trunks and black leaves, until they reached the foot of a high hill, where the Crack was closer, clearer, larger. Everyone stopped, taking a full step back, as though the light itself burned their eyes from a distance.",
          "Someone whispered: \"Don't get any closer. Real light kills.\"",
          "But Grey, driven by something he didn't understand himself, took a step forward.",
          "Someone shouted behind him: \"What are you doing?\"",
          "He didn't answer. Something inside him, something that knew it didn't belong to this world at all, was pulling him toward the light instead of pushing him away from it. He got closer, and closer still, until he stood directly beneath the Crack, the light falling on his face.",
          "He didn't burn.",
          "He didn't hurt.",
          "Instead, he felt a warmth he had never felt before, a warmth like his grandmother's hand on his head in some faded memory. He raised his eyes and looked at the source of the light up close for the first time, and saw what none of the Ghouls had ever seen: the Crack wasn't a door to some coming danger. It was a seed. A tiny star-seed, fallen from a distant sky, glowing in this dark world with no intention of harm, simply because it didn't know how to be anything else.",
          "Grey called out to his companions: \"Come. Look.\"",
          "Everyone hesitated for a long while, but one of them, the youngest, approached first, step by step, his body trembling from inherited fear rather than actual pain. And when he stood beneath the light and wasn't burned, he wept.",
          "He said, wiping his tears with a trembling hand: \"I never knew light could look like this.\"",
          "Grey returned with his companions to the tribe, not with news of a danger to be extinguished, but with news of a guest they had to learn to live beside. The tribe's chief sat and listened, his grey eyes shifting between doubt and curiosity.",
          "The chief finally asked: \"And if it's a trap? And if this gentleness is only the beginning of a greater harm?\"",
          "Grey answered: \"And if it is, aren't we already afraid of everything we don't know? We've lived in the dusk for generations, and we've never once tried to get close to real light to find out. Maybe it's time we learned, instead of ran.\"",
          "A long silence filled the great cave. Then the chief nodded slowly, a small gesture, but enough.",
          "In the following days, the tribe, with great caution and hesitant steps, began drawing closer to the Crack, little by little. It was no longer something to fear, but had become part of the landscape of the dusk-land, a tiny star-seed lighting a single corner of a world that had never seen real light since its birth.",
          "On a quiet night, while Grey sat at the mouth of his cave, watching the distant Crack glow gently, he felt his body begin to grow light, as though an invisible thread had begun pulling him backward, toward somewhere else.",
          "He looked at his hands, and saw them slowly fading, returning to their original shape.",
          "He whispered, knowing no one here would hear him in a few moments: \"Thank you.\"",
          "Then everything went dark.",
          "Nailo opened his eyes and found himself on the cold basement floor just as before, the book still open on his knees, its first page no longer entirely blank. At the bottom, in faintly shimmering silver-grey ink, a single word had appeared: \"Grey.\"",
          "A name he would never forget.",
          "Nailo lifted his eyes from the page, his heart pounding, and looked toward the deep darkness in the far corner of the basement, where the next page of the book waited for him, blank, silent, hungry for another story."
        ]

      {
        id: "ch2",
        titleAr: "الفصل الثاني: توهج يخفت",
        titleEn: "Chapter Two: A Fading Glow",
        contentAr: [
          "فتح نايلو عينيه على ضوء أخضر ناعم يتسلل بين أوراق شجر متوهجة، وشعر بجسده أخف من ريشة. حاول أن يتحرك، فوجد ظهره يحمل جناحين شفافين يرفرفان تلقائيًا، وطوله لا يتجاوز نصف متر. حلّق قيد أنملة عن الأرض قبل أن يتقن التوازن ويهبط بارتباك على غصن رقيق، فارتطم بأنفه بزهرة كبيرة أصدرت رنينًا احتجاجيًا خافتًا.",
          "نظر إلى يديه، فرآهما زرقاوين فاتحتين، وأصابعه دقيقة كأغصان صغيرة. سمع صوتًا في رأسه يهمس اسمه الجديد: زهرة.",
          "كانت الغابة من حوله تتنفس ضوءًا. الأشجار تنبض بأخضر وأزرق ناعمين، والأزهار تصدر رنينًا موسيقيًا خفيفًا كلما هبت نسمة، والأنهار تجري كالفضة السائلة. جنيات صغيرات كن يتطايرن بينها كنحل ملون، يضحكن، يتنافسن في سباقات طيران قصيرة، يتوقفن أحيانًا للثرثرة عند فتحة زهرة كبيرة. رائحة العسل والندى تملأ الهواء، وأصوات ضحكات صغيرة تتردد بين الأغصان كجرس بعيد. كان المشهد أشبه بحلم لا يريد أحد أن يستيقظ منه.",
          "لكن شيئًا كان مختلًا. في بعض الزوايا، كان التوهج يخفت، يتحول إلى رمادي باهت، كأن الغابة نفسها تُصاب بمرض بطيء. لاحظت زهرة أن الجنيات القريبات من تلك الزوايا يطرن بترنّح خفيف، وكأن أجنحتهن أثقل مما ينبغي.",
          "طارت زهرة نحو تجمّع صغير من الجنيات عند جذع شجرة عملاقة، حيث كانت الملكة تستمع إلى شكاوى متتالية. كانت الملكة أكبر حجمًا قليلًا من البقية، تاجها مصنوعًا من نسيج ضوئي ينبض ببطء، ووجهها يحمل تعبًا لم تحاول إخفاءه.",
          "قالت إحدى الجنيات بصوت مرتجف: \"الأزهار في الجهة الشرقية توقفت عن الرنين تمامًا. لم يحدث هذا من قبل.\"",
          "نظرت الملكة إلى الجنية المتحدثة بقلق واضح، ثم إلى بقية الحاضرات، وكأنها تبحث في وجوههن عن إجابة لم تجدها بعد.",
          "سألتها الملكة: \"ومتى بدأ هذا؟\"",

let currentLang = localStorage.getItem("mb_lang") || "ar";
let currentIdeas = [];

const app = document.querySelector("#app");

function t(key) {
  return T[currentLang][key] || key;
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showToast(message) {
  const toast = document.querySelector("#toast");

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

function renderQuotes() {
  const quotes = currentLang === "ar"
    ? [
        "لا يصح أن نغرق في الأحلام وننسى أن نحيا. — ج. ك. رولينغ",
        "الفانتازيا ليست هروبًا من الواقع، بل طريقة لفهمه. — لويد ألكسندر",
        "القارئ يعيش ألف حياة قبل أن يموت. — جورج ر. ر. مارتن"
      ]
    : [
        "It does not do to dwell on dreams and forget to live. — J.K. Rowling",
        "Fantasy is a way of understanding reality. — Lloyd Alexander",
        "A reader lives a thousand lives before he dies. — George R.R. Martin"
      ];

  const track = document.querySelector("#quotesTrack");

  track.innerHTML = [...quotes, ...quotes]
    .map(quote => `<span>${escapeHTML(quote)} ✦</span>`)
    .join("");
}

function setActive(route) {
  document.querySelectorAll(".nav-links a").forEach(link => {
    link.classList.toggle(
      "active",
      link.dataset.route === route
    );
  });
}

function setLanguage(language) {
  currentLang = language;

  localStorage.setItem("mb_lang", language);

  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  document.querySelector("#langToggle").textContent =
    language === "ar" ? "English" : "العربية";

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;

    if (T[language][key]) {
      element.textContent = T[language][key];
    }
  });

  renderQuotes();
  route();
}

    index = (index + 1) % slides.length;

    slides.forEach((slide, i) => {
      slide.classList.toggle("active", i === index);
    });
  }, 5000);
}

async function loadIdeas() {
  const wall = document.querySelector(".ideas-wall");

  if (!wall) return;

  const result = await supabaseClient
    .from("reader_ideas")
    .select("id, name, text, created_at")
    .order("created_at", {
      ascending: false
    });

  if (result.error) {
    console.error(result.error);

    wall.innerHTML = `
      <div class="error-state">
        <span class="icon">⚠️</span>
        <h3>${t("loadError")}</h3>
      </div>
    `;

    return;
  }

  currentIdeas = result.data || [];

  if (currentIdeas.length === 0) {
    wall.innerHTML = `
      <div class="empty-state">
        <span class="icon">✦</span>
        <h3>${t("noIdeas")}</h3>
        <p>${t("beFirst")}</p>
      </div>
    `;

    return;
  }

  wall.innerHTML = currentIdeas
    .map(idea => `
      <div class="idea-note">
        "${escapeHTML(idea.text)}"
        <span class="author">
          — ${escapeHTML(idea.name)}
        </span>
      </div>
    `)
    .join("");
}

async function saveIdea(event) {
  event.preventDefault();

  const nameInput = document.querySelector("#ideaName");
  const textInput = document.querySelector("#ideaText");
  const button = event.submitter;

  const name = nameInput.value.trim();
  const text = textInput.value.trim();

  if (!name || !text) return;

  button.disabled = true;
  button.textContent = t("saving");

  const result = await supabaseClient
    .from("reader_ideas")
    .insert({
      name: name.slice(0, 30),
      text: text.slice(0, 300)
    });

  if (result.error) {
    console.error(result.error);

    showToast(t("saveError"));

    button.disabled = false;
    button.textContent = t("formBtn");

    return;
  }

  nameInput.value = "";
  textInput.value = "";

  button.disabled = false;
  button.textContent = t("formBtn");

  showToast(t("toastSuccess"));

  await loadIdeas();
}

/* Router */
function route() {
  const hash = location.hash || "#/";
  const parts = hash.replace("#/", "").split("/");

  if (parts[0] !== "" && hash !== "#/") {
    clearInterval(heroSlideInterval);
  }

  if (parts[0] === "ideas") {
    ideasView();
  } else if (parts[0] === "novels") {
    novelsView();
  } else if (parts[0] === "about") {
    aboutView();
  } else if (
    parts[0] === "novel" &&
    parts[1] &&
    parts[2] === "chapter" &&
    parts[3]
  ) {
    chapterView(parts[1], parts[3]);
  } else if (
    parts[0] === "novel" &&
    parts[1]
  ) {
    novelView(parts[1]);
  } else if (
    parts[0] === "story" &&
    parts[1] &&
    parts[2] === "chapter" &&
    parts[3]
  ) {
    storyChapterView(parts[1], parts[3]);
  } else if (
    parts[0] === "story" &&
    parts[1]
  ) {
    storyView(parts[1]);
  } else {
    homeView();
  }

  window.scrollTo(0, 0);
}

/* Language */
document.querySelector("#langToggle")
  .addEventListener("click", () => {
    setLanguage(currentLang === "ar" ? "en" : "ar");
  });

/* Mobile menu */
document.querySelector("#menuBtn")
  .addEventListener("click", () => {
    document.body.classList.toggle("menu-open");

    document.querySelector("#menuBtn").textContent =
      document.body.classList.contains("menu-open")
        ? "✕"
        : "☰";
  });

document.querySelectorAll(".nav-links a")
  .forEach(link => {
    link.addEventListener("click", () => {
      document.body.classList.remove("menu-open");
      document.querySelector("#menuBtn").textContent = "☰";
    });
  });

window.addEventListener("hashchange", route);

/* بداية الموقع */
setLanguage(currentLang);
</script>
