<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f19">
<title>MB Novels | Fantasy Worlds</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep:#0b0f19;
  --bg-card:#151b2b;
  --bg-paper:#1e2538;
  --gold:#d4af37;
  --gold-light:#f6e7ad;
  --wine:#722f37;
  --text-main:#e0e6ed;
  --text-muted:#94a3b8;
  --line:rgba(212,175,55,.15);
  --line-strong:rgba(212,175,55,.4);
  --ease:cubic-bezier(.22,.75,.2,1);
  --font-en:'Crimson Text',serif;
  --font-display-en:'Cinzel',serif;
  --font-accent-en:'IM Fell English SC',serif;
  --font-ar:'Amiri',serif;
  --font-display-ar:'Reem Kufi',sans-serif;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html {
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}

body {
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg-deep);
  color:var(--text-main);
  font-family:var(--font-en);
  font-size:17px;
  line-height:1.7;
}

html[lang="ar"] body {
  font-family:var(--font-ar);
}

html[lang="ar"] h1,
html[lang="ar"] h2,
html[lang="ar"] h3,
html[lang="ar"] .brand-text strong {
  font-family:var(--font-display-ar);
}

::selection {
  background:var(--wine);
  color:#fff;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  font-family:inherit;
}

img {
  display:block;
  max-width:100%;
}

:focus-visible {
  outline:2px solid var(--gold);
  outline-offset:3px;
}

.wrap {
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:0 20px;
}

.grain {
  position:fixed;
  inset:0;
  z-index:999;
  pointer-events:none;
  opacity:.035;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

h1,
h2,
h3 {
  color:var(--gold);
  font-family:var(--font-display-en);
  line-height:1.25;
}

.eyebrow {
  display:inline-block;
  margin-bottom:12px;
  color:var(--gold-light);
  font-family:var(--font-accent-en);
  font-size:13px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

html[lang="ar"] .eyebrow {
  font-family:var(--font-ar);
  font-size:17px;
  letter-spacing:normal;
}

.rv {
  opacity:0;
  transform:translateY(25px);
  transition:opacity .7s var(--ease), transform .7s var(--ease);
  transition-delay:calc(var(--i,0) * 100ms);
}

.rv.on {
  opacity:1;
  transform:none;
}

/* Header */
.site-head {
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,15,25,.97);
  border-bottom:1px solid var(--line);
}

.site-head .wrap {
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
}

.logo-mark {
  width:44px;
  height:44px;
  flex-shrink:0;
}

.logo-mark svg {
  width:100%;
  height:100%;
  display:block;
}

.brand-text {
  margin-left:12px;
}

html[dir="rtl"] .brand-text {
  margin-right:12px;
  margin-left:0;
}

.brand-text strong {
  display:block;
  color:var(--text-main);
  font-size:19px;
}

.brand-text em {
  display:block;
  color:var(--text-muted);
  font-size:10px;
  font-style:normal;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.nav-actions {
  display:flex;
  align-items:center;
  gap:7px;
}

.lang-btn {
  min-height:40px;
  padding:9px 13px;
  border:1px solid var(--line-strong);
  color:var(--gold);
  font-family:var(--font-accent-en);
  font-size:12px;
}

html[lang="ar"] .lang-btn {
  font-family:var(--font-ar);
  font-size:16px;
}

.lang-btn:hover {
  background:var(--gold);
  color:var(--bg-deep);
}

.burger {
  display:none;
  width:44px;
  height:44px;
  color:var(--gold);
  font-size:24px;
}

.nav-links {
  display:flex;
  align-items:center;
}

.nav-links a {
  position:relative;
  margin-left:26px;
  padding:8px 0;
  color:var(--text-muted);
  font-family:var(--font-accent-en);
  font-size:14px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

html[dir="rtl"] .nav-links a {
  margin-right:26px;
  margin-left:0;
}

.nav-links a::after {
  content:"";
  position:absolute;
  right:0;
  bottom:2px;
  left:0;
  height:1px;
  background:var(--gold);
  transform:scaleX(0);
  transition:.3s ease;
}

.nav-links a:hover,
.nav-links a.active {
  color:var(--gold);
}

.nav-links a:hover::after,
.nav-links a.active::after {
  transform:scaleX(1);
}

/* Quotes */
.quotes-strip {
  overflow:hidden;
  padding:10px 0;
  background:var(--wine);
  color:#fff;
  direction:ltr;
}

.quotes-track {
  display:flex;
  width:max-content;
  animation:quotesMove 48s linear infinite;
}

.quotes-track span {
  white-space:nowrap;
  padding:0 30px;
  font-family:var(--font-accent-en);
  font-size:13px;
  font-style:italic;
}

html[lang="ar"] .quotes-track span {
  font-family:var(--font-ar);
  font-size:16px;
  font-style:normal;
}

.quotes-track i {
  margin-left:25px;
  color:var(--gold-light);
  font-style:normal;
}

html[lang="ar"] .quotes-track i {
  margin-right:25px;
  margin-left:0;
}

@keyframes quotesMove {
  from { transform:translateX(0); }
  to { transform:translateX(-50%); }
}

html[dir="rtl"] .quotes-track {
  animation-direction:reverse;
}

/* Hero */
.hero {
  padding:65px 0;
  text-align:center;
}

.hero .wrap {
  position:relative;
  z-index:2;
  min-height:400px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:16px;
  padding:55px 25px;
}

.hero-bg {
  position:absolute;
  inset:0;
  z-index:-1;
  overflow:hidden;
  background:#101727;
}

.hero-bg img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 1.5s ease;
}

.hero-bg img.active {
  opacity:1;
}

.hero-bg::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(11,15,25,.72),
    rgba(11,15,25,.45),
    rgba(11,15,25,.92)
  );
}

.hero h1 {
  margin-bottom:18px;
  color:var(--gold-light);
  font-size:clamp(35px,8vw,76px);
  text-shadow:0 3px 15px rgba(0,0,0,.9);
}

.hero p {
  max-width:650px;
  margin-bottom:25px;
  color:#f0f3f6;
  font-size:clamp(17px,4vw,21px);
  text-shadow:0 2px 10px rgba(0,0,0,.95);
}

.hero .orn {
  color:var(--gold);
  font-size:25px;
  letter-spacing:.5em;
}

/* Sections */
.section {
  padding:60px 0;
}

.sec-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:35px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}

.sec-head h2 {
  font-size:clamp(25px,6vw,42px);
}

.novels-section-title {
  margin:35px 0 20px;
  font-size:clamp(24px,5vw,36px);
}

/* Ideas */
.ideas-layout {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  align-items:start;
}

.ideas-form {
  padding:24px;
  border:1px solid var(--line-strong);
  background:var(--bg-paper);
}

.form-group {
  margin-bottom:18px;
}

.form-group label {
  display:block;
  margin-bottom:8px;
  color:var(--gold);
  font-family:var(--font-accent-en);
  font-size:13px;
}

html[lang="ar"] .form-group label {
  font-family:var(--font-ar);
  font-size:17px;
}

.form-input,
.form-textarea {
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  outline:none;
  background:var(--bg-deep);
  color:var(--text-main);
  font:inherit;
  font-size:16px;
}

.form-input:focus,
.form-textarea:focus {
  border-color:var(--gold);
}

.form-textarea {
  min-height:110px;
  resize:vertical;
}

.btn-primary {
  width:100%;
  padding:14px 25px;
  background:var(--gold);
  color:var(--bg-deep);
  font-family:var(--font-accent-en);
  font-weight:bold;
  transition:.3s ease;
}

html[lang="ar"] .btn-primary {
  font-family:var(--font-ar);
  font-size:17px;
}

.btn-primary:hover {
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(212,175,55,.3);
}

.ideas-wall {
  max-height:510px;
  overflow-y:auto;
}

.idea-note {
  margin-bottom:16px;
  padding:18px;
  border-left:3px solid var(--wine);
  background:var(--bg-card);
  color:var(--text-muted);
  font-style:italic;
}

html[dir="rtl"] .idea-note {
  border-right:3px solid var(--wine);
  border-left:0;
}

.idea-note .author {
  display:block;
  margin-top:9px;
  color:var(--gold);
  font-size:12px;
  font-style:normal;
}

/* Novels */
.novels-carousel {
  display:flex;
  gap:20px;
  overflow-x:auto;
  padding:10px 3px 20px;
  scroll-snap-type:x mandatory;
}

html[dir="rtl"] .novels-carousel {
  direction:rtl;
}

.empty-state {
  width:100%;
  padding:55px 20px;
  border:1px dashed var(--line-strong);
  border-radius:12px;
  background:rgba(21,27,43,.4);
  text-align:center;
}

.empty-state .icon,
.chapter-empty .icon {
  margin-bottom:16px;
  color:var(--gold);
  font-size:48px;
}

.empty-state h3,
.chapter-empty h2 {
  margin-bottom:10px;
  color:var(--text-main);
}

.empty-state p,
.chapter-empty p {
  color:var(--text-muted);
}

/* Coming Soon card */
.novel-link {
  display:block;
  width:100%;
}

.coming-novel-card {
  position:relative;
  width:100%;
  max-width:720px;
  min-height:380px;
  margin:auto;
  overflow:hidden;
  border:1px solid var(--line-strong);
  border-radius:16px;
  background:var(--bg-card);
  box-shadow:0 18px 45px rgba(0,0,0,.55);
  cursor:pointer;
  scroll-snap-align:center;
  transition:.35s ease;
}

.coming-novel-card:hover {
  transform:translateY(-6px);
  box-shadow:0 22px 55px rgba(0,0,0,.7);
}

.coming-novel-card > img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.coming-novel-card::after {
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(
    to bottom,
    rgba(5,8,15,.15),
    rgba(5,8,15,.5) 45%,
    rgba(5,8,15,.95)
  );
}

.coming-novel-content {
  position:relative;
  z-index:2;
  min-height:380px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:35px 25px;
  text-align:center;
}

.novel-status {
  margin-bottom:10px;
  color:var(--gold-light);
  font-family:var(--font-accent-en);
  font-size:14px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

html[lang="ar"] .novel-status {
  font-family:var(--font-ar);
  font-size:18px;
  letter-spacing:normal;
}

.coming-novel-content h3 {
  margin-bottom:12px;
  color:var(--gold-light);
  font-size:clamp(28px,5vw,48px);
  text-shadow:0 3px 15px rgba(0,0,0,.95);
}

.coming-novel-content p {
  max-width:570px;
  color:#f0f3f6;
  font-size:16px;
  line-height:1.8;
  text-shadow:0 2px 9px rgba(0,0,0,.95);
}

.novel-decoration {
  margin-top:14px;
  color:var(--gold);
  font-size:21px;
}

/* Novel Details */
.novel-detail {
  max-width:1000px;
  margin:auto;
}

.novel-detail-card {
  display:grid;
  grid-template-columns:300px 1fr;
  gap:35px;
  align-items:start;
  margin-bottom:40px;
  padding:25px;
  border:1px solid var(--line-strong);
  background:var(--bg-card);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.novel-detail-cover {
  width:100%;
  height:400px;
  object-fit:cover;
  border:1px solid var(--line-strong);
  border-radius:10px;
}

.novel-detail-info h1 {
  margin:12px 0 16px;
  color:var(--gold-light);
  font-size:clamp(30px,6vw,52px);
}

.novel-detail-description {
  margin-bottom:23px;
  color:var(--text-muted);
  font-size:18px;
  line-height:1.9;
}

.chapter-count {
  display:inline-block;
  margin-bottom:24px;
  padding:10px 16px;
  border:1px solid var(--line-strong);
  color:var(--gold);
  font-size:17px;
}

.chapter-actions {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.chapter-button {
  display:inline-block;
  padding:12px 18px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--bg-deep);
  font-family:var(--font-accent-en);
  transition:.3s ease;
}

html[lang="ar"] .chapter-button {
  font-family:var(--font-ar);
  font-size:17px;
}

.chapter-button.secondary {
  background:transparent;
  color:var(--gold);
}

.chapter-button:hover {
  background:transparent;
  color:var(--gold);
}

.chapter-button.secondary:hover {
  background:var(--gold);
  color:var(--bg-deep);
}

.chapter-button.disabled {
  opacity:.45;
  pointer-events:none;
}

.chapters-section-title {
  margin-bottom:20px;
  color:var(--gold);
  font-size:30px;
}

.chapters-list {
  display:grid;
  gap:12px;
}

.chapter-list-item {
  display:block;
  padding:17px 20px;
  border:1px solid var(--line);
  background:var(--bg-card);
  transition:.3s ease;
}

.chapter-list-item:hover {
  border-color:var(--gold);
  color:var(--gold);
  transform:translateX(-5px);
}

html[dir="ltr"] .chapter-list-item:hover {
  transform:translateX(5px);
}

.chapter-empty {
  padding:55px 20px;
  border:1px dashed var(--line-strong);
  background:rgba(21,27,43,.4);
  text-align:center;
}

/* Chapter reader */
.chapter-content {
  max-width:900px;
  margin:auto;
  padding:30px;
  border:1px solid var(--line);
  background:var(--bg-paper);
  color:var(--text-main);
  font-size:19px;
  line-height:2;
}

.chapter-content h2 {
  margin-bottom:25px;
  text-align:center;
}

.chapter-content p {
  margin-bottom:18px;
}

.reader-back {
  display:inline-block;
  margin-bottom:20px;
  padding:9px 16px;
  border:1px solid var(--line-strong);
  color:var(--gold);
}

.reader-back:hover {
  background:var(--gold);
  color:var(--bg-deep);
}

/* About */
.about-box {
  max-width:800px;
  margin:auto;
  text-align:center;
}

.about-text {
  color:var(--text-muted);
  line-height:1.9;
}

.about-text p {
  margin-bottom:18px;
}

.about-logo-box {
  margin-top:40px;
  padding:30px;
  border:1px solid var(--line-strong);
  background:var(--bg-card);
}

.about-logo-box .logo-mark {
  width:90px;
  height:90px;
  margin:0 auto 18px;
}

/* Footer */
footer {
  margin-top:60px;
  padding:50px 0 30px;
  border-top:3px solid var(--gold);
  background:#05080f;
}

.footer-grid {
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:40px;
  margin-bottom:40px;
}

.footer-brand p {
  margin-top:15px;
  color:var(--text-muted);
  font-size:14px;
}

.footer-col h4 {
  margin-bottom:18px;
  color:var(--gold);
  font-family:var(--font-accent-en);
  font-size:14px;
}

html[lang="ar"] .footer-col h4 {
  font-family:var(--font-ar);
  font-size:18px;
}

.footer-col ul {
  list-style:none;
}

.footer-col li {
  margin-bottom:10px;
}

.footer-col a {
  color:var(--text-muted);
}

.footer-col a:hover {
  color:var(--gold);
}

.copyright {
  padding-top:25px;
  border-top:1px solid var(--line);
  color:var(--text-muted);
  font-size:11px;
  text-align:center;
}

/* Toast */
.toast {
  position:fixed;
  bottom:25px;
  left:50%;
  z-index:1000;
  max-width:90%;
  padding:13px 25px;
  transform:translate(-50%,120px);
  background:var(--gold);
  color:var(--bg-deep);
  text-align:center;
  pointer-events:none;
  transition:.5s ease;
}

.toast.show {
  transform:translate(-50%,0);
}

/* Mobile */
@media (max-width:900px) {
  .burger {
    display:block;
  }

  .brand-text em {
    display:none;
  }

  .nav-links {
    position:absolute;
    top:70px;
    right:0;
    left:0;
    display:none;
    flex-direction:column;
    padding:8px 20px 16px;
    border-bottom:2px solid var(--gold);
    background:var(--bg-deep);
  }

  body.menu-open .nav-links {
    display:flex;
  }

  .nav-links a,
  html[dir="rtl"] .nav-links a {
    width:100%;
    margin:0;
    padding:15px 6px;
    border-bottom:1px dashed var(--line);
    text-align:center;
  }

  .nav-links a:last-child {
    border-bottom:0;
  }

  .nav-links a::after {
    display:none;
  }

  .ideas-layout {
    grid-template-columns:1fr;
    gap:30px;
  }
}

@media (max-width:750px) {
  .novel-detail-card {
    grid-template-columns:1fr;
  }

  .novel-detail-cover {
    width:min(100%,330px);
    height:420px;
    margin:auto;
  }

  .novel-detail-info {
    text-align:center;
  }

  .chapter-actions {
    justify-content:center;
  }
}

@media (max-width:768px) {
  .footer-grid {
    grid-template-columns:1fr;
    gap:28px;
    text-align:center;
  }

  .coming-novel-card,
  .coming-novel-content {
    min-height:320px;
  }

  .chapter-content {
    padding:20px;
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="grain"></div>
<div class="toast" id="toast"></div>

<header class="site-head">
  <div class="wrap">

    <a href="#/" class="brand">
      <div class="logo-mark">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldLogo" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f6e7ad"/>
              <stop offset="45%" stop-color="#d4af37"/>
              <stop offset="100%" stop-color="#8a7020"/>
            </linearGradient>
          </defs>

          <polygon
            points="60,4 116,34 116,86 60,116 4,86 4,34"
            fill="rgba(212,175,55,.06)"
            stroke="url(#goldLogo)"
            stroke-width="3"
          />

          <text
            x="60"

const $$ = (selector, root=document) =>
  [...root.querySelectorAll(selector)];

function escapeHTML(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(message) {
  const toast = $("#toast");

  if (!toast) return;

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

function initReveals() {
  const elements = $$(".rv");

  if (!("IntersectionObserver" in window)) {
    elements.forEach(el => el.classList.add("on"));
    return;
  }

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("on");
        observer.unobserve(entry.target);
      }
    });
  }, {
    threshold:.1
  });

  elements.forEach(el => observer.observe(el));
}

function setActive(routeName) {
  $$(".nav-links a").forEach(link => {
    link.classList.toggle(
      "active",
      link.dataset.r === routeName
    );
  });
}

  const track = $("#quotesTrack");

  if (!track) return;

  track.innerHTML = [
    ...T[currentLang].quotes,
    ...T[currentLang].quotes

    <span>
      ${escapeHTML(quote)}
      <i>✦</i>
    </span>
  `).join("");
}

function setLang(language) {
  currentLang = language;

  localStorage.setItem("mb_lang", language);

  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  const languageButton = $("#langToggle");

  if (languageButton) {
    languageButton.textContent =
      language === "ar" ? "English" : "العربية";
  }

  $$("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;

    if (T[language][key]) {
      element.textContent = T[language][key];
    }
  });

  renderQuotes();
  route();
}

function startHeroSlider() {
  if (heroTimer) {
    clearInterval(heroTimer);
    heroTimer = null;
  }

  const heroBg = $("#heroBg");

  if (!heroBg) return;

  const images = $$("img", heroBg);

  if (images.length <= 1) return;

  let index = 0;

  heroTimer = setInterval(() => {
    images[index].classList.remove("active");
    index = (index + 1) % images.length;
    images[index].classList.add("active");
  }, 4500);
}

      : novel.descriptionEn;

  const firstButton = firstChapter

        class="chapter-button secondary"

function chapterView(slug, chapterId) {
  const novel = novelsData[slug];

  if (!novel) {
    novelsView();
    return;
  }

  const chapter = (novel.chapters || []).find(
    item => item.id === chapterId
  );

  if (!chapter) {
    novelReaderView(slug);
    return;
  }

  const title =
    currentLang === "ar"
      ? chapter.titleAr
      : chapter.titleEn;

  const paragraphs =
    currentLang === "ar"
      ? chapter.contentAr
      : chapter.contentEn;

  app.innerHTML = `
    <section class="section">
      <div class="wrap">

        <a
          href="#/novel/${slug}"
          class="reader-back"
        >
          ← ${t("backToNovels")}
        </a>

        <article class="chapter-content">
          <h2>${escapeHTML(title)}</h2>

          ${
            paragraphs.map(paragraph => `
              <p>${escapeHTML(paragraph)}</p>
            `).join("")
          }

        </article>

      </div>
    </section>
  `;
}

function submitIdea(event) {
  event.preventDefault();

  const nameInput = $("#ideaName");
  const textInput = $("#ideaText");

  const name = nameInput.value.trim();
  const text = textInput.value.trim();

  if (!name || !text) return;

  userIdeas.push({
    name,
    text,
    date:Date.now()
  });

  localStorage.setItem(
    "mb_ideas",
    JSON.stringify(userIdeas)
  );

  showToast(t("toastSuccess"));
  ideasView();
}

function route() {
  const hash = location.hash || "#/";
  const parts = hash.replace("#/","").split("/");

  if (parts[0] === "ideas") {
    ideasView();
  } else if (parts[0] === "novels") {
    novelsView();
  } else if (parts[0] === "about") {
    aboutView();
  } else if (
    parts[0] === "novel" &&
    parts[1] &&
    parts[2] === "chapter" &&
    parts[3]
  ) {
    chapterView(parts[1], parts[3]);
  } else if (
    parts[0] === "novel" &&
    parts[1]
  ) {
    novelReaderView(parts[1]);
  } else {
    homeView();
  }

  initReveals();
  window.scrollTo(0,0);
}

                  <stop offset="0%" stop-color="#f6e7ad"/>
                  <stop offset="45%" stop-color="#d4af37"/>
                  <stop offset="100%" stop-color="#8a7020"/>
                </linearGradient>
              </defs>

              <polygon
                points="60,4 116,34 116,86 60,116 4,86 4,34"
                fill="rgba(212,175,55,.06)"
                stroke="url(#aboutGold)"
                stroke-width="3"
              />

              <text
                x="60"
                y="75"
                text-anchor="middle"
                font-family="Georgia, serif"
                font-weight="800"
                font-size="50"
                letter-spacing="-5"
                fill="url(#aboutGold)"
              >MB</text>

              <path
                d="M37 89 Q60 103 83 89"
                fill="none"
                stroke="url(#aboutGold)"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>

      </div>
    </section>
  `;
}

const langToggle = $("#langToggle");

if (langToggle) {
  langToggle.addEventListener("click", () => {
    setLang(currentLang === "ar" ? "en" : "ar");
  });
}

const burger = $("#burger");

if (burger) {
  burger.addEventListener("click", event => {
    event.stopPropagation();

    document.body.classList.toggle("menu-open");

    burger.textContent =
      document.body.classList.contains("menu-open")
        ? "✕"
        : "☰";
  });
}

$$(".nav-links a").forEach(link => {
  link.addEventListener("click", () => {
    document.body.classList.remove("menu-open");

    if (burger) {
      burger.textContent = "☰";
    }
  });
});

document.addEventListener("click", event => {
  if (
    document.body.classList.contains("menu-open") &&
    !event.target.closest(".nav-links") &&
    !event.target.closest("#burger")
  ) {
    document.body.classList.remove("menu-open");

    if (burger) {
      burger.textContent = "☰";
    }
  }
});

window.addEventListener("hashchange", route);

setLang(currentLang);
</script>

</body>
</html>
