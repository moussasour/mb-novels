<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f19">
<title>MB Novels</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0b0f19;
  --card:#151b2b;
  --paper:#1e2538;
  --gold:#d4af37;
  --gold-light:#f6e7ad;
  --wine:#722f37;
  --text:#e0e6ed;
  --muted:#94a3b8;
  --line:rgba(212,175,55,.25);
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  min-height:100vh;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Georgia, serif;
  font-size:17px;
  line-height:1.7;
}

html[lang="ar"] body {
  font-family:"Amiri", serif;
}

html[lang="ar"] h1,
html[lang="ar"] h2,
html[lang="ar"] h3,
html[lang="ar"] button,
html[lang="ar"] label {
  font-family:"Reem Kufi", sans-serif;
}

a {
  color:inherit;
  text-decoration:none;
}

button {
  border:0;
  cursor:pointer;
  font-family:inherit;
}

img {
  max-width:100%;
  display:block;
}

.wrap {
  width:100%;
  max-width:1150px;
  margin:auto;
  padding:0 20px;
}

/* رأس الموقع */
.site-head {
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,15,25,.97);
  border-bottom:1px solid var(--line);
}

.site-head .wrap {
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand {
  display:flex;
  align-items:center;
}

.logo {
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border:2px solid var(--gold);
  color:var(--gold-light);
  font-family:Georgia, serif;
  font-size:20px;
  transform:rotate(45deg);
}

.logo span {
  transform:rotate(-45deg);
}

.brand-text {
  margin-right:12px;
}

html[dir="ltr"] .brand-text {
  margin-right:0;
  margin-left:12px;
}

.brand-text strong {
  display:block;
  color:var(--text);
  font-size:19px;
}

.brand-text small {
  display:block;
  color:var(--muted);
  font-size:11px;
}

.nav-actions {
  display:flex;
  align-items:center;
  gap:8px;
}

.lang-btn,
.menu-btn {
  padding:9px 13px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--gold);
  font-size:14px;
}

.menu-btn {
  display:none;
  font-size:22px;
}

/* القائمة */
.nav-links {
  display:flex;
  align-items:center;
}

.nav-links a {
  margin-right:25px;
  color:var(--muted);
  transition:.3s;
}

html[dir="ltr"] .nav-links a {
  margin-right:0;
  margin-left:25px;
}

.nav-links a:hover,
.nav-links a.active {
  color:var(--gold);
}

/* الشريط */
.quotes-strip {
  overflow:hidden;
  padding:9px 0;
  background:var(--wine);
  direction:ltr;
}

.quotes-track {
  display:flex;
  width:max-content;
  animation:moveQuotes 45s linear infinite;
}

.quotes-track span {
  white-space:nowrap;
  padding:0 28px;
  color:white;
}

@keyframes moveQuotes {
  from { transform:translateX(0); }
  to { transform:translateX(-50%); }
}

html[dir="rtl"] .quotes-track {
  animation-direction:reverse;
}

/* الواجهة */
.hero {
  padding:55px 0;
  text-align:center;
}

.hero-box {
  position:relative;
  min-height:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  padding:35px 20px;
  background:#17152b;
}

.hero-image {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

.hero-box::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    rgba(5,8,20,.65),
    rgba(5,8,20,.9)
  );
}

.hero-content {
  position:relative;
  z-index:1;
}

.hero h1 {
  margin:15px 0;
  color:var(--gold-light);
  font-size:clamp(35px,8vw,75px);
  text-shadow:0 3px 15px #000;
}

.hero p {
  max-width:650px;
  color:white;
  font-size:20px;
  text-shadow:0 2px 10px #000;
}

/* الأقسام */
.section {
  padding:55px 0;
}

.section-title {
  margin-bottom:30px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
  color:var(--gold);
  font-size:clamp(27px,5vw,42px);
}

/* نموذج التعليقات */
.ideas-layout {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
}

.ideas-form {
  padding:24px;
  border:1px solid var(--line);
  background:var(--paper);
}

.form-group {
  margin-bottom:18px;
}

.form-group label {
  display:block;
  margin-bottom:7px;
  color:var(--gold);
}

.form-input,
.form-textarea {
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  outline:0;
  background:var(--bg);
  color:var(--text);
  font:inherit;
  font-size:16px;
}

.form-textarea {
  min-height:120px;
  resize:vertical;
}

.form-input:focus,
.form-textarea:focus {
  border-color:var(--gold);
}

.btn-primary {
  width:100%;
  padding:14px;
  background:var(--gold);
  color:var(--bg);
  font-size:16px;
  font-weight:bold;
}

.btn-primary:disabled {
  opacity:.6;
  cursor:wait;
}

.ideas-wall {
  max-height:550px;
  overflow:auto;
}

.idea-note {
  margin-bottom:15px;
  padding:17px;
  border-right:3px solid var(--wine);
  background:var(--card);
  color:var(--muted);
}

html[dir="ltr"] .idea-note {
  border-right:0;
  border-left:3px solid var(--wine);
}

.idea-note .author {
  display:block;
  margin-top:8px;
  color:var(--gold);
  font-size:13px;
}

.loading,
.empty-state,
.error-state {
  padding:40px 20px;
  border:1px dashed var(--line);
  color:var(--muted);
  text-align:center;
}

.empty-state .icon,
.error-state .icon {
  display:block;
  margin-bottom:10px;
  font-size:40px;
}

/* بطاقات الروايات */
.novels-carousel {
  display:flex;
  gap:20px;
  overflow-x:auto;
  padding:10px 0 25px;
}

.novel-card-link {
  flex:0 0 auto;
  width:230px;
}

.novel-card {
  position:relative;
  min-height:340px;
  aspect-ratio:2/3;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--card);
  cursor:pointer;
  transition:.3s;
}

.novel-card:hover {
  transform:translateY(-6px);
  box-shadow:0 15px 35px #000;
}

.novel-card img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.novel-card::after {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 25%,
    rgba(0,0,0,.9)
  );
}

.novel-card-content {
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  z-index:1;
  padding:25px;
  text-align:center;
}

.novel-card-content h3 {
  color:var(--gold-light);
  font-size:34px;
  direction:ltr;
}

.novel-card-content p {
  color:white;
}

/* صفحة تفاصيل الرواية */
.novel-details {
  max-width:950px;
  margin:auto;
}

.novel-details-box {
  display:grid;
  grid-template-columns:300px 1fr;
  gap:30px;
  padding:25px;
  border:1px solid var(--line);
  background:var(--card);
}

.novel-cover {
  width:100%;
  aspect-ratio:2/3;
  height:auto;
  object-fit:cover;
  border-radius:10px;
}

.novel-details h1 {
  margin:12px 0 16px;
  color:var(--gold-light);
  font-size:clamp(30px,6vw,52px);
  direction:ltr;
}

.novel-description {
  margin-bottom:20px;
  color:var(--muted);
  font-size:18px;
}

.chapter-count {
  display:inline-block;
  margin-bottom:20px;
  padding:9px 14px;
  border:1px solid var(--line);
  color:var(--gold);
}

.chapter-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.chapter-button {
  display:inline-block;
  padding:11px 16px;
  border:1px solid var(--gold);
  background:var(--gold);
  color:var(--bg);
}

.chapter-button.secondary {
  background:transparent;
  color:var(--gold);
}

.chapter-button.disabled {
  opacity:.4;
  pointer-events:none;
}

.chapter-list {
  display:grid;
  gap:12px;
}

.chapter-item {
  display:block;
  padding:16px;
  border:1px solid var(--line);
  background:var(--card);
  transition:.3s;
}

.chapter-item:hover {
  border-color:var(--gold);
  color:var(--gold);
}

.reader-back {
  display:inline-block;
  margin-bottom:20px;
  padding:8px 14px;
  border:1px solid var(--line);
  color:var(--gold);
}

.chapter-content {
  max-width:850px;
  margin:auto;
  padding:30px;
  background:var(--paper);
  color:var(--text);
  font-size:19px;
  line-height:2;
}

.chapter-content h2 {
  margin-bottom:25px;
  text-align:center;
}

.chapter-nav {
  display:flex;
  justify-content:center;
  margin-top:35px;
}

.chapter-nav .chapter-button {
  padding:14px 28px;
  font-size:17px;
}

/* عن الموقع */
.about-box {
  max-width:800px;
  margin:auto;
  text-align:center;
}

.about-box p {
  margin-bottom:18px;
  color:var(--muted);
}

/* Footer */
footer {
  margin-top:50px;
  padding:45px 0 25px;
  border-top:3px solid var(--gold);
  background:#05080f;
}

.footer-grid {
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:30px;
}

.footer-col h4 {
  margin-bottom:14px;
  color:var(--gold);
}

.footer-col ul {
  list-style:none;
}

.footer-col li {
  margin-bottom:8px;
}

.footer-col a {
  color:var(--muted);
}

.copyright {
  margin-top:35px;
  padding-top:20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  text-align:center;
  font-size:12px;
}

.toast {
  position:fixed;
  bottom:25px;
  left:50%;
  z-index:100;
  padding:12px 22px;
  transform:translate(-50%,120px);
  background:var(--gold);
  color:var(--bg);
  transition:.4s;
}

.toast.show {
  transform:translate(-50%,0);
}

@media(max-width:850px) {
  .menu-btn {
    display:block;
  }

  .nav-links {
    position:absolute;
    top:70px;
    right:0;
    left:0;
    display:none;
    flex-direction:column;
    padding:10px 20px;
    background:var(--bg);
    border-bottom:2px solid var(--gold);
  }

  body.menu-open .nav-links {
    display:flex;
  }

  .nav-links a,
  html[dir="ltr"] .nav-links a {
    width:100%;
    margin:0;
    padding:13px;
    border-bottom:1px solid var(--line);
    text-align:center;
  }

  .ideas-layout {
    grid-template-columns:1fr;
  }

  .novel-details-box {
    grid-template-columns:1fr;
  }

  .novel-cover {
    width:min(100%,280px);
    aspect-ratio:2/3;
    margin:auto;
  }

  .novel-details-info {
    text-align:center;
  }

  .chapter-buttons {
    justify-content:center;
  }

  .footer-grid {
    grid-template-columns:1fr;
    text-align:center;
  }
}
</style>
</head>

let currentLang = localStorage.getItem("mb_lang") || "ar";
let currentIdeas = [];

const app = document.querySelector("#app");

function t(key) {
  return T[currentLang][key] || key;
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showToast(message) {
  const toast = document.querySelector("#toast");

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}

function renderQuotes() {
  const quotes = currentLang === "ar"
    ? [
        "لا يصح أن نغرق في الأحلام وننسى أن نحيا. — ج. ك. رولينغ",
        "الفانتازيا ليست هروبًا من الواقع، بل طريقة لفهمه. — لويد ألكسندر",
        "القارئ يعيش ألف حياة قبل أن يموت. — جورج ر. ر. مارتن"
      ]
    : [
        "It does not do to dwell on dreams and forget to live. — J.K. Rowling",
        "Fantasy is a way of understanding reality. — Lloyd Alexander",
        "A reader lives a thousand lives before he dies. — George R.R. Martin"
      ];

  const track = document.querySelector("#quotesTrack");

  track.innerHTML = [...quotes, ...quotes]
    .map(quote => `<span>${escapeHTML(quote)} ✦</span>`)
    .join("");
}

function setActive(route) {
  document.querySelectorAll(".nav-links a").forEach(link => {
    link.classList.toggle(
      "active",
      link.dataset.route === route
    );
  });
}

function setLanguage(language) {
  currentLang = language;

  localStorage.setItem("mb_lang", language);

  document.documentElement.lang = language;
  document.documentElement.dir =
    language === "ar" ? "rtl" : "ltr";

  document.querySelector("#langToggle").textContent =
    language === "ar" ? "English" : "العربية";

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;

    if (T[language][key]) {
      element.textContent = T[language][key];
    }
  });

  renderQuotes();
  route();
}

async function loadIdeas() {
  const wall = document.querySelector(".ideas-wall");

  if (!wall) return;

  const result = await supabaseClient
    .from("reader_ideas")
    .select("id, name, text, created_at")
    .order("created_at", {
      ascending: false
    });

  if (result.error) {
    console.error(result.error);

    wall.innerHTML = `
      <div class="error-state">
        <span class="icon">⚠️</span>
        <h3>${t("loadError")}</h3>
      </div>
    `;

    return;
  }

  currentIdeas = result.data || [];

  if (currentIdeas.length === 0) {
    wall.innerHTML = `
      <div class="empty-state">
        <span class="icon">✦</span>
        <h3>${t("noIdeas")}</h3>
        <p>${t("beFirst")}</p>
      </div>
    `;

    return;
  }

  wall.innerHTML = currentIdeas
    .map(idea => `
      <div class="idea-note">
        "${escapeHTML(idea.text)}"
        <span class="author">
          — ${escapeHTML(idea.name)}
        </span>
      </div>
    `)
    .join("");
}

async function saveIdea(event) {
  event.preventDefault();

  const nameInput = document.querySelector("#ideaName");
  const textInput = document.querySelector("#ideaText");
  const button = event.submitter;

  const name = nameInput.value.trim();
  const text = textInput.value.trim();

  if (!name || !text) return;

  button.disabled = true;
  button.textContent = t("saving");

  const result = await supabaseClient
    .from("reader_ideas")
    .insert({
      name: name.slice(0, 30),
      text: text.slice(0, 300)
    });

  if (result.error) {
    console.error(result.error);

    showToast(t("saveError"));

    button.disabled = false;
    button.textContent = t("formBtn");

    return;
  }

  nameInput.value = "";
  textInput.value = "";

  button.disabled = false;
  button.textContent = t("formBtn");

  showToast(t("toastSuccess"));

  await loadIdeas();
}

          ← ${t("back")}
        </a>

        <div class="novel-details-box">

          <img
            class="novel-cover"
            src="${story.image}"
            alt="${title}"
          >

          <div class="novel-details-info">

            <h1>
              ${title}
            </h1>

            <p class="novel-description">
              ${description}
            </p>

            <div class="chapter-count">
              ${t("totalChapters")}:
              <strong>${chapters.length}</strong>
            </div>

            <div class="chapter-buttons">
              ${firstButton}
              ${latestButton}
            </div>

          </div>

        </div>

        <h2 class="novels-section-title">
          ${t("chapters")}
        </h2>

        <div class="chapter-list">
          ${chaptersHTML}
        </div>

      </div>
    </section>
  `;
}

/* صفحة فصل القصة القصيرة */
function storyChapterView(storyId, chapterId) {
  const story = shortStories[storyId];

  if (!story) {
    novelsView();
    return;
  }

  const chapters = story.chapters;

  const chapterIndex = chapters.findIndex(
    item => item.id === chapterId
  );

  const chapter = chapters[chapterIndex];

  if (!chapter) {
    storyView(storyId);
    return;
  }

  const nextChapter = chapters[chapterIndex + 1];

  const title =
    currentLang === "ar"
      ? chapter.titleAr
      : chapter.titleEn;

  const content =
    currentLang === "ar"
      ? chapter.contentAr
      : chapter.contentEn;

  const nextButton = nextChapter
    ? `
      <a
        class="chapter-button"
        href="#/story/${storyId}/chapter/${nextChapter.id}"
      >
        ${t("nextChapter")}
      </a>
    `
    : `
      <a
        class="chapter-button secondary"
        href="#/story/${storyId}"
      >
        ${t("backToNovel")}
      </a>
    `;

  app.innerHTML = `
    <section class="section">
      <div class="wrap">

        <a
          href="#/story/${storyId}"
          class="reader-back"
        >
          ← ${t("back")}
        </a>

        <article class="chapter-content">
          <h2>${escapeHTML(title)}</h2>

          ${content.map(paragraph => `
            <p>${escapeHTML(paragraph)}</p>
          `).join("")}
        </article>

        <div class="chapter-nav">
          ${nextButton}
        </div>

      </div>
    </section>
  `;
}

/* عن الموقع */
function aboutView() {
  setActive("about");

  app.innerHTML = `
    <section class="section">
      <div class="wrap about-box">

        <span class="eyebrow">
          ${t("navAbout")}
        </span>

        <h1>
          ${t("brandName")}
        </h1>

        <p>
          ${
            currentLang === "ar"
              ? "نصنع عوالم حيث يتنفس السحر، وتعيش الأساطير، ولا تنتهي المغامرات."
              : "We create worlds where magic breathes, legends live, and adventures never end."
          }
        </p>

        <p>
          ${
            currentLang === "ar"
              ? "هذا الموقع مكتبة وورشة للقصص والروايات."
              : "This website is a library and workshop for stories and novels."
          }
        </p>

      </div>
    </section>
  `;
}

/* Router */
function route() {
  const hash = location.hash || "#/";
  const parts = hash.replace("#/", "").split("/");

  if (parts[0] === "ideas") {
    ideasView();
  } else if (parts[0] === "novels") {
    novelsView();
  } else if (parts[0] === "about") {
    aboutView();
  } else if (
    parts[0] === "novel" &&
    parts[1] === "linguistic-fantasy" &&
    parts[2] === "chapter" &&
    parts[3]
  ) {
    chapterView(parts[3]);
  } else if (
    parts[0] === "novel" &&
    parts[1] === "linguistic-fantasy"
  ) {
    novelView();
  } else if (
    parts[0] === "story" &&
    parts[1] &&
    parts[2] === "chapter" &&
    parts[3]
  ) {
    storyChapterView(parts[1], parts[3]);
  } else if (
    parts[0] === "story" &&
    parts[1]
  ) {
    storyView(parts[1]);
  } else {
    homeView();
  }

  window.scrollTo(0, 0);
}

/* Language */
document.querySelector("#langToggle")
  .addEventListener("click", () => {
    setLanguage(currentLang === "ar" ? "en" : "ar");
  });

/* Mobile menu */
document.querySelector("#menuBtn")
  .addEventListener("click", () => {
    document.body.classList.toggle("menu-open");

    document.querySelector("#menuBtn").textContent =
      document.body.classList.contains("menu-open")
        ? "✕"
        : "☰";
  });

document.querySelectorAll(".nav-links a")
  .forEach(link => {
    link.addEventListener("click", () => {
      document.body.classList.remove("menu-open");
      document.querySelector("#menuBtn").textContent = "☰";
    });
  });

window.addEventListener("hashchange", route);

/* بداية الموقع */
setLanguage(currentLang);
</script>

</body>
</html>
